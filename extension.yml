schema_version: "1.0"

extension:
  id: changelog
  name: Spec Changelog
  version: "1.0.0"
  description: "Auto-generate changelogs and release notes from spec git history and requirement diffs"
  author: Quratulain-bilal
  repository: https://github.com/Quratulain-bilal/spec-kit-changelog
  license: MIT

requires:
  speckit_version: ">= 0.4.0"

provides:
  commands:
    - name: speckit.changelog.generate
      file: commands/speckit.changelog.generate.md
      description: "Generate a full changelog from spec git history showing all requirement changes over time"
    - name: speckit.changelog.release
      file: commands/speckit.changelog.release.md
      description: "Generate release notes for a specific version or tag from spec changes"
    - name: speckit.changelog.diff
      file: commands/speckit.changelog.diff.md
      description: "Generate a human-readable diff between two spec versions showing exactly what changed"
    - name: speckit.changelog.notify
      file: commands/speckit.changelog.notify.md
      description: "Generate stakeholder notifications summarizing spec changes for team communication"
  hooks:
    - after_implement

hooks:
  after_implement:
    command: speckit.changelog.generate
    optional: true
    description: "Offer to generate changelog entry after implementation"

tags:
  - changelog
  - release-notes
  - documentation
  - git-history
  - notifications
